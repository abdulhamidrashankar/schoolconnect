name: my_first_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2 
  fluttertoast: ^9.0.0
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_local_notifications: ^19.4.2
  permission_handler: ^12.0.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.10


flutter_native_splash:
  color: "#ffffff"
  image: assets/images/classbridge_logo1.png
  android_gravity: center
  fullscreen: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/classbridge_logo1.png"


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/environment/dev_config.json
    - assets/environment/prod_config.json
    - assets/images/login_s.png
    - assets/images/school.png
    - assets/images/ClassBridge_splash_screen.png
    - assets/images/img_splash_screen.png
    - assets/images/classbridge_logo1.png
    - assets/images/classbridge_logo2.png
    - assets/images/ClassBridgeL.png
  
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package


